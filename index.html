<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIST GradeMetric</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --rolling-speed: 0.8s cubic-bezier(0.65, 0, 0.35, 1);

            /* DARK THEME: Original Black & Gold */
            --body-bg: radial-gradient(circle at center, #1a1a1a 0%, #000000 100%);
            --card-bg: #0a0a0a;
            --card-inner-bg: #0d0d0d;
            --text-color: #ffffff;
            --accent: var(--gold);
            --track-bg: #111111;
            --input-bg: #0a0a0a;
            --btn-text-inactive: #777777;
            --btn-text-active: #000000;
            --theme-btn-bg: #ffffff; 
            --theme-btn-text: #000000;
            --border-color: #333333;
        }

        /* LIGHT THEME: Cream & Dark Olive */
        .light-mode {
            --body-bg: #F5F5DC; 
            --card-bg: #ffffff;
            --card-inner-bg: #fdfdfd;
            --text-color: #1a1a1a; 
            --accent: #556B2F; /* Dark Olive */
            --track-bg: #e0e0e0;
            --input-bg: #ffffff;
            --btn-text-inactive: #555555;
            --btn-text-active: #ffffff;
            --theme-btn-bg: #3b2f2f; 
            --theme-btn-text: #ffffff;
            --border-color: #cccccc;
        }

        body {
            background: var(--body-bg);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            color: var(--text-color);
            padding: 20px;
            transition: background 0.4s ease;
        }

        #theme-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--theme-btn-bg);
            color: var(--theme-btn-text);
            border: none;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
            z-index: 100;
            transition: all 0.3s ease;
        }

        .app-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            z-index: 1;
            transition: background 0.3s ease;
        }

        .app-card::before {
            content: '';
            position: absolute;
            width: 150%;
            height: 150%;
            background: conic-gradient(transparent, transparent, transparent, var(--accent));
            left: -25%;
            top: -25%;
            animation: rotateLight 7s linear infinite;
            z-index: -2;
        }

        .app-card::after {
            content: '';
            position: absolute; inset: 2px;
            background: var(--card-inner-bg);
            border-radius: 23px;
            z-index: -1;
            transition: background 0.3s ease;
        }

        @keyframes rotateLight {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 { color: var(--accent); text-align: center; font-size: 24px; font-weight: 800; text-transform: uppercase; margin-bottom: 25px; transition: color 0.3s; }

        .selector-track {
            position: relative;
            display: flex;
            background: var(--track-bg);
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            height: 48px;
            align-items: center;
            isolation: isolate; 
            transition: background 0.3s, border 0.3s;
        }

        .selector-track button {
            flex: 1; height: 100%; border: none; background: none;
            color: var(--btn-text-inactive); font-weight: 700; cursor: pointer;
            z-index: 3; transition: color 0.4s ease; font-family: 'Open Sans';
        }

        .selector-track button.active { color: var(--btn-text-active); }

        .rolling-glider {
            position: absolute; height: calc(100% - 10px); width: calc(50% - 5px);
            background: var(--accent); border-radius: 40px; 
            z-index: 1; left: 5px; transition: transform var(--rolling-speed), background 0.3s;
        }

        .input-group label { display: block; font-size: 11px; color: var(--accent); font-weight: 700; margin-bottom: 6px; text-transform: uppercase; transition: color 0.3s; }

        input, select {
            width: 100%; border: 1px solid var(--border-color); background: var(--input-bg); padding: 12px;
            border-radius: 12px; color: var(--text-color); margin-bottom: 15px; box-sizing: border-box; 
            font-family: 'Open Sans'; transition: all 0.3s ease; outline: none;
        }

        input:focus { border-color: var(--accent); }

        .ct-grid, .grid-inputs { display: grid; gap: 10px; }
        .ct-grid { grid-template-columns: 1fr 1fr 1fr; }
        .grid-inputs { grid-template-columns: 1fr 1fr; }
        .course-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        .calc-btn {
            width: 100%; background: var(--accent); color: var(--btn-text-active); border: none; padding: 15px;
            border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; 
            margin-top: 10px; font-family: 'Open Sans'; transition: background 0.3s, color 0.3s;
        }

        .reset-btn {
            width: 100%; background: transparent; color: var(--btn-text-inactive); border: 1px solid var(--border-color);
            padding: 8px; margin-top: 10px; border-radius: 12px; cursor: pointer; font-size: 11px; transition: all 0.3s;
        }

        .result-box {
            margin-top: 20px; padding: 15px; background: rgba(128, 128, 0, 0.05);
            border: 2px solid var(--accent); border-radius: 15px; text-align: center; transition: border 0.3s;
        }

        #displayResult { color: var(--accent); font-weight: 700; }

        .footer-credit { margin-top: 25px; text-align: center; font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; opacity: 0.9; transition: color 0.3s; }
    </style>
</head>
<body>

<div class="app-card">
    <button id="theme-toggle" onclick="toggleTheme()">Light Mode</button>
    <h1>MIST GradeMetric</h1>

    <div class="selector-track">
        <div id="tabGlider" class="rolling-glider"></div>
        <button id="tab-mark" class="active" onclick="switchTab('mark')">Estimator</button>
        <button id="tab-cgpa" onclick="switchTab('cgpa')">CGPA Calc</button>
    </div>

    <div id="mark-section">
        <div class="selector-track" style="height: 40px;">
            <div id="creditGlider" class="rolling-glider" style="transform: translateX(100%);"></div>
            <button id="btn2" onclick="setCredit(2)">2.0 Credits</button>
            <button id="btn3" class="active" onclick="setCredit(3)">3.0 Credits</button>
        </div>

        <div class="input-group">
            <label>CT MARKS (Max 20)</label>
            <div class="ct-grid">
                <input type="number" id="ct1" placeholder="CT 1">
                <input type="number" id="ct2" placeholder="CT 2">
                <input type="number" id="ct3" placeholder="CT 3">
            </div>
        </div>
        <div class="grid-inputs">
            <div class="input-group"><label id="midLabel">MID TERM (Max 30)</label><input type="number" id="midterm"></div>
            <div class="input-group"><label id="attLabel">ATTENDANCE (Max 15)</label><input type="number" id="attendance"></div>
            <div class="input-group"><label id="perfLabel">CLASS PERF. (Max 15)</label><input type="number" id="performance"></div>
            <div class="input-group">
                <label>TARGET GPA</label>
                <select id="targetGPA">
                    <option value="80.0">4.00 (A+)</option>
                    <option value="75.0">3.75 (A)</option>
                    <option value="70.0">3.50 (A-)</option>
                    <option value="60.0">3.00 (B)</option>
                </select>
            </div>
        </div>
        <button class="calc-btn" onclick="calculateMark()">Calculate Requirement</button>
    </div>

    <div id="cgpa-section" style="display: none;">
        <div class="input-group">
            <label>COURSE DETAILS</label>
            <div id="course-rows">
                <div class="course-row">
                    <input type="number" step="0.01" class="c-credit" placeholder="Credit">
                    <input type="number" step="0.01" class="c-gp" placeholder="GP">
                </div>
            </div>
            <button style="width:100%; background:none; color:var(--accent); border:1px dashed var(--accent); padding:8px; border-radius:10px; cursor:pointer; margin-bottom:15px; font-size:11px;" onclick="addRow()">+ Add Subject</button>
        </div>
        <button class="calc-btn" onclick="calculateCGPA()">Calculate CGPA</button>
    </div>

    <button class="reset-btn" onclick="resetForm()">Reset Fields</button>

    <div id="resultBox" class="result-box" style="display:none;">
        <div id="displayResult"></div>
    </div>

    <div class="footer-credit">Made by Abir Anwar Khan (AE-17)</div>
</div>

<script>
    let selectedCredit = 3;

    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('theme-toggle');
        body.classList.toggle('light-mode');
        btn.innerText = body.classList.contains('light-mode') ? "Dark Mode" : "Light Mode";
    }

    function switchTab(tab) {
        const glider = document.getElementById('tabGlider');
        const isMark = (tab === 'mark');
        document.getElementById('mark-section').style.display = isMark ? 'block' : 'none';
        document.getElementById('cgpa-section').style.display = isMark ? 'none' : 'block';
        glider.style.transform = isMark ? 'translateX(0)' : 'translateX(100%)';
        document.getElementById('tab-mark').classList.toggle('active', isMark);
        document.getElementById('tab-cgpa').classList.toggle('active', !isMark);
        document.getElementById('resultBox').style.display = "none";
    }

    function setCredit(val) {
        selectedCredit = val;
        const glider = document.getElementById('creditGlider');
        glider.style.transform = (val === 2) ? 'translateX(0)' : 'translateX(100%)';
        document.getElementById('btn2').classList.toggle('active', val === 2);
        document.getElementById('btn3').classList.toggle('active', val === 3);
        
        document.getElementById('midLabel').innerText = `MID TERM (Max ${val === 2 ? 20 : 30})`;
        document.getElementById('attLabel').innerText = `ATTENDANCE (Max ${val === 2 ? 10 : 15})`;
        document.getElementById('perfLabel').innerText = `CLASS PERF. (Max ${val === 2 ? 10 : 15})`;
    }

    function calculateMark() {
        const cts = [parseFloat(document.getElementById('ct1').value)||0, parseFloat(document.getElementById('ct2').value)||0, parseFloat(document.getElementById('ct3').value)||0].sort((a,b)=>b-a);
        const mid = parseFloat(document.getElementById('midterm').value) || 0;
        const att = parseFloat(document.getElementById('attendance').value) || 0;
        const perf = parseFloat(document.getElementById('performance').value) || 0;
        const target = parseFloat(document.getElementById('targetGPA').value);

        const maxM = selectedCredit === 2 ? 20 : 30;
        const maxO = selectedCredit === 2 ? 10 : 15;
        const finalMax = selectedCredit === 2 ? 120 : 180;

        let current = ((cts[0]+cts[1])/2) + (mid/maxM*10) + (att/maxO*5) + (perf/maxO*5);
        let needed = ((target - current) / 60) * finalMax;

        if (needed > finalMax) showResult("Target Unreachable", true);
        else showResult(`NEED IN FINAL: ${Math.max(0, needed).toFixed(2)} / ${finalMax}`);
    }

    function calculateCGPA() {
        const credits = document.getElementsByClassName('c-credit');
        const gps = document.getElementsByClassName('c-gp');
        let tP = 0, tC = 0;
        for(let i=0; i<credits.length; i++) {
            let c = parseFloat(credits[i].value), g = parseFloat(gps[i].value);
            if(!isNaN(c) && !isNaN(g)) { tP += (c*g); tC += c; }
        }
        if(tC > 0) showResult(`ESTIMATED GPA: ${(tP/tC).toFixed(2)}`);
    }

    function addRow() {
        const row = document.createElement('div');
        row.className = 'course-row';
        row.innerHTML = `<input type="number" step="0.01" class="c-credit" placeholder="Credit"><input type="number" step="0.01" class="c-gp" placeholder="GP">`;
        document.getElementById('course-rows').appendChild(row);
    }

    function showResult(msg, err=false) {
        const box = document.getElementById('resultBox');
        box.style.display = "block";
        const d = document.getElementById('displayResult');
        d.innerText = msg;
        d.style.color = err ? "#d9534f" : "var(--accent)";
    }

    function resetForm() {
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('resultBox').style.display = "none";
    }
</script>
</body>
</html>
