<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIST GradeMetric - Olive Edition</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --olive: #808000;
            --cream: #F5F5DC;
            --white: #ffffff;
            --text-dark: #333333;
            --border: #cccccc;
            --rolling-speed: 0.8s cubic-bezier(0.65, 0, 0.35, 1);
        }

        body {
            background-color: var(--cream);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Open Sans', sans-serif;
            margin: 0;
            color: var(--text-dark);
            padding: 20px;
        }

        .app-card {
            background: var(--white);
            padding: 30px;
            border-radius: 25px;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 10px 30px rgba(128, 128, 0, 0.15);
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        h1 { 
            color: var(--olive); 
            text-align: center; 
            font-size: 22px; 
            font-weight: 800; 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            letter-spacing: 1px;
        }

        /* Tabs */
        .selector-track {
            position: relative;
            display: flex;
            background: #eeeeee;
            border-radius: 50px;
            padding: 5px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            height: 48px;
            align-items: center;
            isolation: isolate; 
        }

        .selector-track button {
            flex: 1;
            height: 100%;
            border: none;
            background: none;
            color: #666;
            font-weight: 700;
            cursor: pointer;
            z-index: 3;
            transition: color 0.4s ease;
            font-family: 'Open Sans', sans-serif;
        }

        .selector-track button.active { color: white; }

        .rolling-glider {
            position: absolute;
            height: calc(100% - 10px);
            width: calc(50% - 5px);
            background: var(--olive);
            border-radius: 40px; 
            z-index: 1;
            left: 5px;
            transition: transform var(--rolling-speed);
        }

        /* Inputs */
        .input-group label { 
            display: block; 
            font-size: 11px; 
            color: var(--olive); 
            font-weight: 700; 
            margin-bottom: 6px; 
            text-transform: uppercase; 
        }

        input, select {
            width: 100%; border: 1px solid var(--border); background: var(--white); padding: 12px;
            border-radius: 12px; color: var(--text-dark); margin-bottom: 15px; box-sizing: border-box; 
            font-family: 'Open Sans', sans-serif;
        }

        .ct-grid, .grid-inputs { display: grid; gap: 10px; }
        .ct-grid { grid-template-columns: 1fr 1fr 1fr; }
        .grid-inputs { grid-template-columns: 1fr 1fr; }
        .course-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

        /* Buttons */
        .calc-btn {
            width: 100%; background: var(--olive); color: white; border: none; padding: 15px;
            border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; 
            margin-top: 10px; font-family: 'Open Sans', sans-serif;
        }

        .reset-btn {
            width: 100%; background: transparent; color: #888; border: 1px solid var(--border);
            padding: 8px; margin-top: 10px; border-radius: 12px; cursor: pointer; font-size: 11px;
        }

        .result-box {
            margin-top: 20px; padding: 15px; background: rgba(128, 128, 0, 0.05);
            border: 2px solid var(--olive); border-radius: 15px; text-align: center;
        }

        #displayResult { color: var(--olive); font-weight: 700; }

        .footer-credit { 
            margin-top: 25px; 
            text-align: center; 
            font-size: 11px; 
            color: var(--olive); 
            font-weight: 700; 
            text-transform: uppercase; 
            opacity: 0.8; 
        }
    </style>
</head>
<body>

<div class="app-card">
    <h1>MIST GradeMetric</h1>

    <div class="selector-track">
        <div id="tabGlider" class="rolling-glider"></div>
        <button id="tab-mark" class="active" onclick="switchTab('mark')">Estimator</button>
        <button id="tab-cgpa" onclick="switchTab('cgpa')">CGPA Calc</button>
    </div>

    <div id="mark-section">
        <div class="selector-track" style="height: 40px;">
            <div id="creditGlider" class="rolling-glider" style="transform: translateX(100%);"></div>
            <button id="btn2" onclick="setCredit(2)">2.0 Cr</button>
            <button id="btn3" class="active" onclick="setCredit(3)">3.0 Cr</button>
        </div>

        <div class="input-group">
            <label>CT MARKS (Best 2 of 3)</label>
            <div class="ct-grid">
                <input type="number" id="ct1" placeholder="CT 1">
                <input type="number" id="ct2" placeholder="CT 2">
                <input type="number" id="ct3" placeholder="CT 3">
            </div>
        </div>

        <div class="grid-inputs">
            <div class="input-group"><label id="midLabel">MID (Max 30)</label><input type="number" id="midterm"></div>
            <div class="input-group"><label id="attLabel">ATT (Max 15)</label><input type="number" id="attendance"></div>
            <div class="input-group"><label id="perfLabel">PERF (Max 15)</label><input type="number" id="performance"></div>
            <div class="input-group">
                <label>TARGET GPA</label>
                <select id="targetGPA">
                    <option value="80.0">4.00 (A+)</option>
                    <option value="75.0">3.75 (A)</option>
                    <option value="70.0">3.50 (A-)</option>
                    <option value="65.0">3.25 (B+)</option>
                    <option value="60.0">3.00 (B)</option>
                </select>
            </div>
        </div>
        <button class="calc-btn" onclick="calculateMark()">Check Requirement</button>
    </div>

    <div id="cgpa-section" style="display: none;">
        <div class="input-group">
            <label>COURSE DATA</label>
            <div id="course-rows">
                <div class="course-row">
                    <input type="number" step="0.01" class="c-credit" placeholder="Credit">
                    <input type="number" step="0.01" class="c-gp" placeholder="GP">
                </div>
            </div>
            <button style="width:100%; background:none; color:var(--olive); border:1px dashed var(--olive); padding:8px; border-radius:10px; cursor:pointer; margin-bottom:15px; font-size:11px;" onclick="addRow()">+ Add Course</button>
        </div>
        <button class="calc-btn" onclick="calculateCGPA()">Calculate CGPA</button>
    </div>

    <button class="reset-btn" onclick="resetForm()">Clear All Fields</button>

    <div id="resultBox" class="result-box" style="display:none;">
        <div id="displayResult"></div>
    </div>

    <div class="footer-credit">MD ABIR ANWAR KHAN | AE-17</div>
</div>

<script>
    let selectedCredit = 3;

    function switchTab(tab) {
        const glider = document.getElementById('tabGlider');
        const isMark = (tab === 'mark');
        document.getElementById('mark-section').style.display = isMark ? 'block' : 'none';
        document.getElementById('cgpa-section').style.display = isMark ? 'none' : 'block';
        glider.style.transform = isMark ? 'translateX(0)' : 'translateX(100%)';
        document.getElementById('tab-mark').classList.toggle('active', isMark);
        document.getElementById('tab-cgpa').classList.toggle('active', !isMark);
    }

    function setCredit(val) {
        selectedCredit = val;
        const glider = document.getElementById('creditGlider');
        const isTwo = (val === 2);
        glider.style.transform = isTwo ? 'translateX(0)' : 'translateX(100%)';
        document.getElementById('btn2').classList.toggle('active', isTwo);
        document.getElementById('btn3').classList.toggle('active', !isTwo);
        
        document.getElementById('midLabel').innerText = isTwo ? "MID (Max 20)" : "MID (Max 30)";
        document.getElementById('attLabel').innerText = isTwo ? "ATT (Max 10)" : "ATT (Max 15)";
        document.getElementById('perfLabel').innerText = isTwo ? "PERF (Max 10)" : "PERF (Max 15)";
    }

    function calculateMark() {
        const cts = [parseFloat(document.getElementById('ct1').value)||0, parseFloat(document.getElementById('ct2').value)||0, parseFloat(document.getElementById('ct3').value)||0].sort((a,b)=>b-a);
        const ctAvg = (cts[0] + cts[1]) / 2;
        const mid = parseFloat(document.getElementById('midterm').value) || 0;
        const att = parseFloat(document.getElementById('attendance').value) || 0;
        const perf = parseFloat(document.getElementById('performance').value) || 0;
        const target = parseFloat(document.getElementById('targetGPA').value);

        const maxM = selectedCredit === 2 ? 20 : 30;
        const maxO = selectedCredit === 2 ? 10 : 15;
        const finalMax = selectedCredit === 2 ? 120 : 180;

        let current = ctAvg + (mid/maxM * 10) + (att/maxO * 5) + (perf/maxO * 5);
        let needed = ((target - current) / 60) * finalMax;

        if (needed > finalMax) showResult("Target Not Reachable", true);
        else showResult(`NEED IN FINAL: ${Math.max(0, needed).toFixed(2)} / ${finalMax}`);
    }

    function calculateCGPA() {
        const credits = document.getElementsByClassName('c-credit');
        const gps = document.getElementsByClassName('c-gp');
        let tP = 0, tC = 0;
        for(let i=0; i<credits.length; i++) {
            let c = parseFloat(credits[i].value), g = parseFloat(gps[i].value);
            if(!isNaN(c) && !isNaN(g)) { tP += (c*g); tC += c; }
        }
        if(tC > 0) showResult(`ESTIMATED GPA: ${(tP/tC).toFixed(2)}`);
    }

    function addRow() {
        const row = document.createElement('div');
        row.className = 'course-row';
        row.innerHTML = `<input type="number" step="0.01" class="c-credit" placeholder="Credit"><input type="number" step="0.01" class="c-gp" placeholder="GP">`;
        document.getElementById('course-rows').appendChild(row);
    }

    function showResult(msg, err=false) {
        document.getElementById('resultBox').style.display = "block";
        const d = document.getElementById('displayResult');
        d.innerText = msg;
        d.style.color = err ? "#d9534f" : "var(--olive)";
    }

    function resetForm() {
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('resultBox').style.display = "none";
    }
</script>

</body>
</html>
