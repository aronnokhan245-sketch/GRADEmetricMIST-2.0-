<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MIST GradeMetric | Cinematic</title>
    <link href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg-dark: #050505;
            --glass: rgba(255, 255, 255, 0.03);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        /* Cinematic Background */
        body {
            background: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            color: white;
            overflow-x: hidden;
        }

        /* Entrance Animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .app-container {
            animation: slideUpFade 1s var(--transition);
            width: 95%;
            max-width: 450px;
            position: relative;
        }

        .app-card {
            background: var(--glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            position: relative;
            overflow: hidden;
        }

        /* CHANGE 2: Top Shine Animation */
        @keyframes shineMove {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .app-card::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 100%; height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            animation: shineMove 3s linear infinite; /* Restoration: Added animation back to your line */
        }

        h1 { 
            font-family: 'Syncopate', sans-serif;
            color: var(--gold); 
            text-align: center; 
            font-size: 20px; 
            font-weight: 700; 
            letter-spacing: 4px;
            margin-bottom: 35px;
            text-shadow: 0 0 15px var(--gold-glow);
        }

        /* Tabs Logic */
        .selector-track {
            position: relative;
            display: flex;
            background: rgba(0,0,0,0.4);
            border-radius: 15px;
            padding: 4px;
            margin-bottom: 25px;
            border: 1px solid rgba(255,255,255,0.05);
            height: 44px;
            align-items: center;
        }

        .selector-track button {
            flex: 1;
            height: 100%;
            border: none;
            background: none;
            color: #666;
            font-weight: 600;
            cursor: pointer;
            z-index: 3;
            transition: var(--transition);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .selector-track button.active { color: #000; }

        .rolling-glider {
            position: absolute;
            height: calc(100% - 8px);
            width: calc(50% - 4px);
            background: var(--gold);
            border-radius: 12px; 
            z-index: 1;
            left: 4px;
            transition: transform 0.6s cubic-bezier(0.19, 1, 0.22, 1);
            box-shadow: 0 4px 15px var(--gold-glow);
        }

        /* CHANGE 1: Flashing Input Animation */
        @keyframes inputFlash {
            0% { border-color: rgba(255,255,255,0.1); }
            50% { border-color: var(--gold); box-shadow: 0 0 10px rgba(212, 175, 55, 0.2); }
            100% { border-color: rgba(255,255,255,0.1); }
        }

        .input-group label { 
            display: block; 
            font-size: 9px; 
            color: #888; 
            font-weight: 700; 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 2px;
        }
        
        input, select {
            width: 100%; 
            border: 1px solid rgba(255,255,255,0.1); 
            background: rgba(0,0,0,0.3); 
            padding: 14px;
            border-radius: 12px; 
            color: #fff; 
            margin-bottom: 18px; 
            box-sizing: border-box; 
            font-size: 14px;
            transition: var(--transition);
            animation: inputFlash 3s infinite ease-in-out; /* Added flashing */
        }

        input:focus {
            outline: none;
            border-color: var(--gold);
            background: rgba(212, 175, 55, 0.05);
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.1);
            animation: none;
        }

        .ct-grid, .grid-inputs { display: grid; gap: 12px; }
        .ct-grid { grid-template-columns: 1fr 1fr 1fr; }
        .grid-inputs { grid-template-columns: 1fr 1fr; }

        .calc-btn {
            width: 100%; 
            background: var(--gold); 
            color: #000; 
            border: none; 
            padding: 16px;
            border-radius: 12px; 
            font-weight: 800; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin-top: 15px;
            transition: var(--transition);
        }

        .calc-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px var(--gold-glow);
            filter: brightness(1.1);
        }

        .reset-btn {
            width: 100%; background: transparent; color: #555; border: 1px solid transparent;
            padding: 10px; margin-top: 15px; cursor: pointer; font-size: 10px;
            text-transform: uppercase; letter-spacing: 1px; transition: var(--transition);
        }

        .reset-btn:hover { color: var(--gold); }

        /* CHANGE 3: Restored and Updated Result Box */
        .result-box {
            margin-top: 25px; 
            padding: 20px; 
            background: rgba(0, 0, 0, 0.6); /* Darker background like the image */
            border: 1px solid var(--gold); 
            border-radius: 20px; 
            text-align: center;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
            animation: slideUpFade 0.5s ease-out;
        }

        #displayResult { 
            color: var(--gold); 
            font-weight: 700; 
            font-size: 16px; 
            letter-spacing: 1px;
        }

        .footer-credit { 
            margin-top: 30px; 
            text-align: center; 
            font-size: 9px; 
            color: #444; 
            font-weight: 700;
            text-transform: uppercase; 
            letter-spacing: 3px;
        }

        .course-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-card">
        <h1>GRADE METRIC</h1>

        <div class="selector-track">
            <div id="tabGlider" class="rolling-glider"></div>
            <button id="tab-mark" class="active" onclick="switchTab('mark')">Estimator</button>
            <button id="tab-cgpa" onclick="switchTab('cgpa')">CGPA Calc</button>
        </div>

        <div id="mark-section">
            <div class="selector-track" style="background: rgba(255,255,255,0.02);">
                <div id="creditGlider" class="rolling-glider" style="transform: translateX(100%);"></div>
                <button id="btn2" onclick="setCredit(2)">2.0 CR</button>
                <button id="btn3" class="active" onclick="setCredit(3)">3.0 CR</button>
            </div>

            <div class="input-group">
                <label>CT Scores (20)</label>
                <div class="ct-grid">
                    <input type="number" id="ct1" placeholder="CT-1">
                    <input type="number" id="ct2" placeholder="CT-2">
                    <input type="number" id="ct3" placeholder="CT-3">
                </div>
            </div>
            
            <div class="grid-inputs">
                <div class="input-group"><label id="midLabel">Midterm (30)</label><input type="number" id="midterm"></div>
                <div class="input-group"><label id="attLabel">Attendance (15)</label><input type="number" id="attendance"></div>
                <div class="input-group"><label id="perfLabel">Performance (15)</label><input type="number" id="performance"></div>
                <div class="input-group">
                    <label>Target Grade</label>
                    <select id="targetGPA">
                        <option value="80.0">4.00 (A+)</option>
                        <option value="75.0">3.75 (A)</option>
                        <option value="70.0">3.50 (A-)</option>
                        <option value="65.0">3.25 (B+)</option>
                        <option value="60.0">3.00 (B)</option>
                    </select>
                </div>
            </div>
            <button class="calc-btn" onclick="calculateMark()">Run Analysis</button>
        </div>

        <div id="cgpa-section" style="display: none;">
            <div class="input-group">
                <label>Subject Roster</label>
                <div id="course-rows">
                    <div class="course-row">
                        <input type="number" step="0.01" class="c-credit" placeholder="Credit">
                        <input type="number" step="0.01" class="c-gp" placeholder="GPA">
                    </div>
                </div>
                <button style="width:100%; background:transparent; color:var(--gold); border:1px dashed rgba(212,175,55,0.3); padding:10px; border-radius:12px; cursor:pointer; margin-bottom:15px; font-size:10px; text-transform: uppercase;" onclick="addRow()">+ Add Subject</button>
            </div>
            <button class="calc-btn" onclick="calculateCGPA()">Compute CGPA</button>
        </div>

        <button class="reset-btn" onclick="resetForm()">System Reset</button>

        <div id="resultBox" class="result-box" style="display:none;">
            <div id="displayResult"></div>
        </div>

        <div class="footer-credit">Aeronautical Engineering · AE-17</div>
    </div>
</div>

<script>
    let selectedCredit = 3;

    function switchTab(tab) {
        const glider = document.getElementById('tabGlider');
        const isMark = (tab === 'mark');
        document.getElementById('mark-section').style.display = isMark ? 'block' : 'none';
        document.getElementById('cgpa-section').style.display = isMark ? 'none' : 'block';
        glider.style.transform = isMark ? 'translateX(0)' : 'translateX(100%)';
        document.getElementById('tab-mark').classList.toggle('active', isMark);
        document.getElementById('tab-cgpa').classList.toggle('active', !isMark);
        document.getElementById('resultBox').style.display = "none";
    }

    function setCredit(val) {
        selectedCredit = val;
        const glider = document.getElementById('creditGlider');
        const isTwo = (val === 2);
        glider.style.transform = isTwo ? 'translateX(0)' : 'translateX(100%)';
        document.getElementById('btn2').classList.toggle('active', isTwo);
        document.getElementById('btn3').classList.toggle('active', !isTwo);
        
        const maxMid = isTwo ? 20 : 30;
        const maxOther = isTwo ? 10 : 15;
        document.getElementById('midLabel').innerText = `Midterm (${maxMid})`;
        document.getElementById('attLabel').innerText = `Attendance (${maxOther})`;
        document.getElementById('perfLabel').innerText = `Performance (${maxOther})`;
    }

    function calculateMark() {
        const cts = [parseFloat(document.getElementById('ct1').value), parseFloat(document.getElementById('ct2').value), parseFloat(document.getElementById('ct3').value)];
        for(let v of cts) if (v > 20) return showResult("ERR: CT MARKS > 20", true);
        
        let ctArray = cts.filter(n => !isNaN(n)).sort((a,b) => b-a);
        if (ctArray.length < 2) return alert("System requires at least 2 CT marks.");
        
        const mid = parseFloat(document.getElementById('midterm').value) || 0;
        const att = parseFloat(document.getElementById('attendance').value) || 0;
        const perf = parseFloat(document.getElementById('performance').value) || 0;
        const target = parseFloat(document.getElementById('targetGPA').value);

        const maxM = selectedCredit === 2 ? 20 : 30;
        const maxO = selectedCredit === 2 ? 10 : 15;
        if (mid > maxM || att > maxO || perf > maxO) return showResult(`ERR: LIMIT EXCEEDED`, true);

        let cur = ((ctArray[0]+ctArray[1])/2) + (mid/maxM*10) + (att/maxO*5) + (perf/maxO*5);
        let maxF = selectedCredit === 2 ? 120 : 180;
        let final = ((target - cur) / 60) * maxF;

        if (final > maxF) showResult("PROJECTION: UNREACHABLE", true);
        else showResult(`REQUIREMENT: ${Math.max(0, final).toFixed(2)} / ${maxF}`);
    }

    function calculateCGPA() {
        const credits = document.getElementsByClassName('c-credit');
        const gps = document.getElementsByClassName('c-gp');
        let totalP = 0, totalC = 0;
        for (let i = 0; i < credits.length; i++) {
            let c = parseFloat(credits[i].value), g = parseFloat(gps[i].value);
            if (!isNaN(c) && !isNaN(g)) {
                totalP += (c * g); totalC += c;
            }
        }
        if (totalC === 0) return alert("Input subject data.");
        showResult(`ESTIMATED CGPA: ${(totalP / totalC).toFixed(3)}`);
    }

    function addRow() {
        const div = document.createElement('div');
        div.className = 'course-row';
        div.innerHTML = `<input type="number" step="0.01" class="c-credit" placeholder="Credit"><input type="number" step="0.01" class="c-gp" placeholder="GPA">`;
        document.getElementById('course-rows').appendChild(div);
    }

    function showResult(msg, err=false) {
        const rb = document.getElementById('resultBox');
        rb.style.display = "block";
        const d = document.getElementById('displayResult');
        d.innerHTML = msg; 
        d.style.color = err ? "#ff4d4d" : "var(--gold)";
    }

    function resetForm() {
        document.querySelectorAll('input').forEach(i => i.value = '');
        document.getElementById('course-rows').innerHTML = `<div class="course-row"><input type="number" step="0.01" class="c-credit" placeholder="Credit"><input type="number" step="0.01" class="c-gp" placeholder="GPA"></div>`;
        document.getElementById('resultBox').style.display = "none";
        setCredit(3); switchTab('mark');
    }
</script>
</body>
</html>
